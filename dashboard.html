<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Illuminati.ethiopia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        // INSTANT THEME LOAD (Before body renders)
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        @font-face {
            font-family: 'Amoria';
            src: url('/fonts/AMORIA.otf') format('opentype');
            /* Standardized font path */
        }

        .font-amoria {
            font-family: 'Amoria', serif;
        }

        .notif-dot {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 10px;
            height: 10px;
            background-color: #ef4444;
            border-radius: 50%;
            border: 2px solid #1A1C1E;
        }

        @media (max-width: 768px) {
            #messaging-modal>div {
                width: 100% !important;
                height: 100% !important;
                max-width: none !important;
                border-radius: 0 !important;
            }
        }
    </style>
</head>

<body
    class="bg-[#F8F9FA] dark:bg-[#0E1012] text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">

    <!-- Navigation -->
    <nav
        class="flex flex-col md:flex-row items-center justify-between px-4 md:px-10 py-4 md:py-6 border-b border-gray-100 dark:border-white/5 sticky top-0 bg-white/80 dark:bg-[#0E1012]/80 backdrop-blur-md z-40">
        <div class="flex items-center justify-between w-full md:w-auto">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='/'">
                <img src="/assets/ethiopiaemblem.svg" alt="Emblem" class="w-8 h-8 md:w-10 md:h-10">
                <div class="flex flex-col leading-tight">
                    <span class="font-amoria text-[1.4rem] font-bold">Illuminati</span>
                    <span class="text-[10px] opacity-60 tracking-[0.2em] font-normal uppercase">.ethiopia</span>
                </div>
            </div>

            <!-- Mobile Actions -->
            <div class="flex items-center gap-4 md:hidden">
                <div class="relative cursor-pointer" onclick="toggleMessaging()">
                    <i data-lucide="mail" class="w-6 h-6 text-gray-500"></i>
                    <div id="msg-dot-mobile" class="notif-dot hidden"></div>
                </div>
                <button id="theme-toggle-mobile"
                    class="p-2 rounded-full border border-gray-200 dark:border-gray-800 text-gray-500">
                    <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
                    <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                </button>
            </div>
        </div>

        <div class="flex flex-wrap items-center justify-center gap-3 md:gap-6 w-full md:w-auto mt-4 md:mt-0">
            <!-- Desktop Actions -->
            <div class="hidden md:flex items-center gap-5 mr-4">
                <div class="relative cursor-pointer group" onclick="toggleMessaging()">
                    <i data-lucide="mail" class="w-5 h-5 text-gray-500 group-hover:text-white transition-colors"></i>
                    <div id="msg-dot" class="notif-dot hidden"></div>
                </div>
                <div class="relative cursor-pointer group">
                    <i data-lucide="bell" class="w-5 h-5 text-gray-500 group-hover:text-white transition-colors"></i>
                    <div id="notif-dot" class="notif-dot hidden"></div>
                </div>
                <button id="theme-toggle-desktop"
                    class="p-2 rounded-full border border-gray-200 dark:border-white/10 text-gray-500 hover:text-white transition-all">
                    <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
                    <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
                </button>
            </div>

            <div
                class="flex items-center gap-1.5 md:gap-2 bg-gradient-to-r from-[#AEEFB5]/60 to-[#9BE3A3]/60 dark:from-[#376b3a]/40 dark:to-[#4a8a4d]/40 text-green-900 dark:text-[#AEEFB5] px-4 py-2 rounded-full font-bold shadow-sm border border-[#AEEFB5]/50 dark:border-[#5db465]/40 text-sm md:text-base">
                <i data-lucide="dollar-sign" class="w-4 h-4"></i>
                <span id="user-balance-val">0.00</span>
            </div>

            <div class="flex items-center gap-2 md:gap-3 pl-4 border-l border-gray-200 dark:border-white/10">
                <div class="flex flex-col items-end mr-1">
                    <span id="user-name-display"
                        class="text-xs md:text-sm font-bold text-gray-800 dark:text-gray-100">User</span>
                    <span id="user-role-badge"
                        class="text-[9px] uppercase tracking-[0.2em] text-green-600 dark:text-[#AEEFB5] font-black">Role</span>
                </div>
                <div class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-[#FF7E33] shadow-md cursor-pointer overflow-hidden border-2 border-white/10"
                    id="profile-trigger">
                    <div id="avatar-container"
                        class="w-full h-full flex items-center justify-center text-white font-bold"></div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-[1200px] mx-auto px-4 md:px-6 mt-8 md:mt-12 pb-24">
        <!-- Hero -->
        <div class="text-center space-y-4">
            <h1 id="hero-title"
                class="text-3xl md:text-6xl font-bold text-gray-900 dark:text-white tracking-tight opacity-0 transition-opacity duration-700">
                Dashboard
            </h1>
            <p id="hero-subtitle"
                class="text-gray-500 dark:text-gray-400 text-base md:text-xl max-w-xl mx-auto leading-relaxed opacity-0 transition-opacity duration-700">
                Loading secure transmission...
            </p>
        </div>

        <!-- Search -->
        <div class="relative max-w-[640px] mx-auto mt-10">
            <input type="text" id="dashboard-search" placeholder="Search for a logo or council member..."
                class="w-full pl-6 pr-14 py-4 rounded-full bg-white dark:bg-[#1A1C1E] shadow-xl border border-gray-100 dark:border-white/5 text-lg text-gray-900 dark:text-white focus:outline-none focus:ring-4 focus:ring-[#AEEFB5]/20 transition-all">
            <button
                class="absolute right-2.5 top-1/2 -translate-y-1/2 w-11 h-11 bg-[#AEEFB5] text-green-900 rounded-full flex items-center justify-center shadow-lg">
                <i data-lucide="search" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Banner -->
        <div
            class="mt-14 bg-white/60 dark:bg-[#1A1C1E]/60 backdrop-blur-md border border-gray-200 dark:border-white/5 rounded-3xl md:rounded-full px-6 py-5 flex flex-col md:flex-row items-center justify-between gap-6 shadow-sm">
            <div class="flex items-center gap-4">
                <div class="flex -space-x-3">
                    <div class="p-2 bg-[#FF7E33]/10 rounded-full"><i data-lucide="shield"
                            class="w-6 h-6 text-[#FF7E33]"></i></div>
                    <div class="p-2 bg-[#FF7E33]/5 rounded-full"><i data-lucide="shield"
                            class="w-6 h-6 text-[#FF7E33] opacity-40"></i></div>
                </div>
                <p class="text-[15px] font-medium text-gray-800 dark:text-gray-200">
                    <span id="banner-mode" class="font-bold">Syncing...</span>
                    <span id="banner-desc" class="opacity-60 block md:inline md:ml-2">Establishing secure council
                        connection.</span>
                </p>
            </div>
            <button
                class="w-full md:w-auto px-6 py-2.5 bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 rounded-full text-sm font-bold text-gray-900 dark:text-white hover:bg-gray-50 transition-all">
                View Plans
            </button>
        </div>

        <!-- Grid -->
        <div id="card-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-16"></div>
    </main>

    <!-- FOOTER -->
    <footer class="mt-20 border-t border-gray-100 dark:border-white/5 bg-white dark:bg-[#0E1012] py-16 px-6">
        <div class="max-w-[1200px] mx-auto flex flex-col md:flex-row justify-between items-center gap-10">
            <div class="flex flex-col items-center md:items-start gap-4">
                <div class="flex items-center gap-2">
                    <img src="/assets/ethiopiaemblem.svg" class="w-8 h-8 opacity-40 grayscale">
                    <span class="font-amoria text-2xl font-bold opacity-40">Illuminati</span>
                </div>
                <p class="text-[10px] text-gray-500 font-bold uppercase tracking-[0.3em]">© 2026 Protocols Established
                </p>
            </div>
            <div class="flex gap-8 text-[11px] font-black text-gray-400 uppercase tracking-widest">
                <a href="#" class="hover:text-white transition-colors">Privacy</a>
                <a href="#" class="hover:text-white transition-colors">Council</a>
                <a href="#" class="hover:text-white transition-colors">Secure</a>
            </div>
        </div>
    </footer>

    <!-- MESSAGING -->
    <div id="messaging-modal"
        class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50 backdrop-blur-lg">
        <div
            class="bg-white dark:bg-[#1A1C1E] w-full max-w-2xl h-[85vh] md:rounded-[40px] overflow-hidden flex flex-col shadow-2xl border border-white/10 transition-all">
            <div
                class="p-8 border-b border-gray-100 dark:border-white/5 flex justify-between items-center bg-[#FAFAFA] dark:bg-[#111213]">
                <h2 class="text-2xl font-bold flex items-center gap-4">
                    <i data-lucide="message-square" class="w-8 h-8 text-[#AEEFB5]"></i>
                    Secure Messaging
                </h2>
                <button onclick="toggleMessaging()"
                    class="p-3 hover:bg-white/10 rounded-full text-gray-500 transition-colors">
                    <i data-lucide="x" class="w-8 h-8"></i>
                </button>
            </div>
            <div id="messages-body" class="flex-1 overflow-y-auto p-8 space-y-5 flex flex-col"></div>
            <div class="p-8 bg-[#FAFAFA] dark:bg-[#111213] border-t border-gray-100 dark:border-white/5">
                <form onsubmit="sendMessage(event)" class="flex gap-4">
                    <input type="text" id="msg-input" placeholder="Type secure transmission..."
                        class="flex-1 bg-white dark:bg-[#0E1012] border border-gray-200 dark:border-white/10 rounded-[24px] px-8 py-5 outline-none focus:ring-4 focus:ring-[#AEEFB5]/20 text-lg transition-all">
                    <button
                        class="bg-[#AEEFB5] text-black w-16 h-16 rounded-[24px] flex items-center justify-center hover:scale-105 active:scale-95 transition-all shadow-xl shadow-[#AEEFB5]/20">
                        <i data-lucide="send" class="w-7 h-7"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- PROFILE -->
    <div id="profile-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 backdrop-blur-md">
        <div
            class="bg-[#1A1C1E] p-10 rounded-[40px] border border-white/10 w-[90%] max-w-[440px] shadow-2xl scale-in-center">
            <div class="flex justify-between items-center mb-10">
                <h2 class="text-3xl font-bold font-amoria text-white">Edit Profile</h2>
                <button id="close-profile-modal-icon" class="p-2 hover:bg-white/5 rounded-full text-gray-500">
                    <i data-lucide="x" class="w-7 h-7"></i>
                </button>
            </div>
            <div class="space-y-8">
                <div>
                    <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-3">Your
                        Display Name</label>
                    <input type="text" id="edit-name"
                        class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 text-white focus:ring-2 focus:ring-[#AEEFB5] outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-3">Profile
                        Picture Link</label>
                    <input type="text" id="edit-avatar" placeholder="https://..."
                        class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 text-white focus:ring-2 focus:ring-[#AEEFB5] outline-none">
                </div>
                <div class="pt-6 space-y-4">
                    <button onclick="saveProfile()"
                        class="w-full py-5 bg-[#AEEFB5] text-black font-black rounded-2xl hover:bg-[#9DE4A5] transition-all">Save
                        Profile Changes</button>
                    <button id="logout-btn"
                        class="w-full py-4 bg-transparent border border-red-500/30 text-red-500 font-bold rounded-2xl hover:bg-red-500/10 transition-all">Logout
                        Account</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /** 
         * API Connection Configuration
         * Ensures the dashboard points to the correct backend.
         */
        const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
            ? 'http://localhost:3001'
            : 'https://your-api-production-url.vercel.app'; // TODO: Replace with your actual production backend URL
    </script>
    <script src="dashboard.js"></script>
</body>

</html>
