<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Order - Login | Illuminati.ethiopia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @font-face {
      font-family: Delight;
      src: url("https://cdn.prod.website-files.com/68c276a7cb47ae57b08b33d1/68c2772925b371feed8be318_Delight-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    .delight { font-family: Delight, Arial, sans-serif; }
  </style>
</head>
<body class="font-body min-h-screen w-full bg-cover bg-center relative bg-no-repeat flex justify-center items-center py-8"
  style="background-image: url('https://i.postimg.cc/vTXTYy2P/login-bg.jpg');">
  <div class="w-full max-w-md px-4">
    <div class="bg-black/80 backdrop-blur-3xl z-10 p-8 relative w-full border-t-4 border-green-600 rounded-lg shadow-2xl">
      <div class="flex flex-col gap-4">

        <div class="mb-4 text-center">
          <a href="index.html">
            <h1 class="delight text-4xl text-green-500">THE ORDER</h1>
          </a>
        </div>

        <div>
          <h4 class="text-white text-xl font-semibold mb-1">Access Portal</h4>
          <p class="text-gray-400 mb-6 text-sm">Enter your credentials to access the Order.</p>

          <div id="error-msg" class="hidden text-red-400 text-sm bg-red-400/10 border border-red-400/30 rounded px-3 py-2 mb-4"></div>

          <form id="login-form" class="flex flex-col gap-4">
            <div>
              <label for="identifier" class="block text-sm font-semibold text-gray-200 mb-2">Email or Phone</label>
              <input class="block w-full rounded py-2 px-3 bg-transparent border border-white/10 text-white/80 focus:border-green-500 focus:outline-none"
                type="text" id="identifier" required placeholder="Email or phone number" />
            </div>
            <div>
              <label for="password" class="block text-sm font-semibold text-gray-200 mb-2">Passphrase</label>
              <input class="block w-full rounded py-2 px-3 bg-transparent border border-white/10 text-white/80 focus:border-green-500 focus:outline-none"
                type="password" id="password" required placeholder="Enter your passphrase" />
            </div>
            <button class="w-full py-2.5 bg-white/10 text-white border border-white/20 rounded-lg hover:bg-green-600/70 transition-all duration-300 font-semibold mt-2"
              type="submit">Initialize Override</button>
          </form>
        </div>

        <footer class="text-center mt-2">
          <p class="text-sm text-gray-400">No clearance?
            <a href="register.html" class="text-green-500 ml-1 hover:underline font-bold">Request Access</a>
          </p>
        </footer>
      </div>
    </div>
  </div>

  <script src="public/assets/db.js"></script>
  <script>
    // If already logged in, redirect
    const session = DB.getSession();
    if (session) {
      if (session.role === 'Admin') window.location.href = 'dashboard-admin.html';
      else if (session.role === 'Agent') window.location.href = 'dashboard-agent.html';
      else window.location.href = 'dashboard-member.html';
    }

    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const id = document.getElementById('identifier').value.trim();
      const pw = document.getElementById('password').value;
      const result = DB.login(id, pw);
      if (!result.ok) {
        const err = document.getElementById('error-msg');
        err.textContent = result.error;
        err.classList.remove('hidden');
        return;
      }
      if (result.user.role === 'Admin') window.location.href = 'dashboard-admin.html';
      else if (result.user.role === 'Agent') window.location.href = 'dashboard-agent.html';
      else window.location.href = 'dashboard-member.html';
    });
  </script>
</body>
</html>
