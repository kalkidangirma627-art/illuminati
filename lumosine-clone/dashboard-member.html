<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Dashboard | Illuminati.ethiopia</title>
  <link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">
  <link rel="stylesheet" href="public/assets/dashboard-style.css">
  <style>
    .stage-card { transition: all 0.3s ease; }
    .progress-bar-fill { transition: width 0.7s cubic-bezier(0.4,0,0.2,1); }
    .msg-badge { background: #34c471; color: white; border-radius: 50%; padding: 0 6px; font-size: 11px; margin-left: 6px; }
    .notify-feed { display: flex; flex-direction: column; gap: 0; }
    .notify-item { display: flex; gap: 12px; padding: 16px; border-top: 1px solid var(--message-box-border); align-items: flex-start; }
    .notify-item img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .notify-item .notify-body { flex: 1; }
    .notify-item .notify-sender { font-weight: 600; color: var(--main-color); font-size: 14px; }
    .notify-item .notify-text { color: var(--secondary-color); font-size: 13px; margin: 4px 0; line-height: 1.4; }
    .notify-item .notify-time { color: var(--secondary-color); font-size: 11px; opacity: 0.7; }
    .view-only-badge { background: rgba(255,94,94,0.15); border: 1px solid rgba(255,94,94,0.3); color: #ff5e5e; padding: 3px 10px; border-radius: 20px; font-size: 12px; }
    .status-pill { padding: 3px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .status-done { background: rgba(52,196,113,0.15); color: #34c471; }
    .status-pending { background: rgba(255,148,46,0.15); color: #ff942e; }
    .messages-section { overflow-y: auto; }
    @media (max-width: 900px) {
      .messages-section { position: fixed !important; top: 0; right: 0; height: 100vh; width: 320px; z-index: 100; }
    }
  </style>
</head>
<body>
<div class="app-container">

  <!-- HEADER -->
  <div class="app-header">
    <div class="app-header-left">
      <span class="app-icon"></span>
      <p class="app-name">My Dashboard</p>
      <div class="search-wrapper">
        <input class="search-input" type="text" placeholder="Search stages...">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      </div>
    </div>
    <div class="app-header-right">
      <button class="mode-switch" title="Switch Theme">
        <svg class="moon" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" width="24" height="24" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
      <button class="notification-btn" id="notif-btn" title="Notifications">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
      <button class="profile-btn" id="profile-btn-header">
        <img id="header-avatar" src="" alt="avatar">
        <span id="header-name">Member</span>
      </button>
      <button onclick="DB.logout()" title="Logout" style="background:transparent;border:none;cursor:pointer;padding:8px;color:var(--main-color);">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
    <button class="messages-btn" id="messages-toggle-btn" title="Notifications from Agent">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
    </button>
  </div>

  <!-- MAIN CONTENT -->
  <div class="app-content">

    <!-- SIDEBAR -->
    <div class="app-sidebar">
      <a href="#" class="app-sidebar-link active">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
      <a href="#" class="app-sidebar-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><path d="M21.21 15.89A10 10 0 118 2.83M22 12A10 10 0 0012 2v10z"/></svg>
      </a>
    </div>

    <!-- PROJECTS SECTION -->
    <div class="projects-section">
      <div class="projects-section-header">
        <p>My Application Progress</p>
        <p class="time" id="member-overall-status">—</p>
      </div>
      <div class="projects-section-line">
        <div class="projects-status">
          <div class="item-status">
            <span class="status-number" id="stages-done">0</span>
            <span class="status-type">Completed</span>
          </div>
          <div class="item-status">
            <span class="status-number" id="stages-remaining">5</span>
            <span class="status-type">Remaining</span>
          </div>
          <div class="item-status">
            <span class="status-number" id="stages-total">5</span>
            <span class="status-type">Total Stages</span>
          </div>
        </div>
        <div class="view-actions">
          <button class="view-btn list-view" title="List View">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
          <button class="view-btn grid-view active" title="Grid View">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          </button>
        </div>
      </div>

      <!-- STAGE CARDS (filled by JS) -->
      <div class="project-boxes jsGridView" id="stage-cards-container">
        <!-- rendered by JS -->
      </div>
    </div><!-- end projects-section -->

  </div><!-- end app-content -->

  <!-- MESSAGES PANEL -->
  <div class="messages-section" id="messages-panel">
    <button class="messages-close" id="messages-close-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
    </button>
    <div class="projects-section-header" style="display:flex;align-items:center;justify-content:space-between;padding-right:48px;">
      <p>Agent Notifications</p>
      <span class="view-only-badge">View Only</span>
    </div>
    <div class="messages notify-feed" id="notifications-feed">
      <!-- rendered by JS -->
    </div>
  </div>

</div><!-- end app-container -->

<script src="public/assets/db.js"></script>
<script>
  // Auth guard
  const session = DB.requireAuth('Member');
  if (!session) throw new Error('Not authenticated');

  // Set header info
  document.getElementById('header-name').textContent = session.name;
  document.getElementById('header-avatar').src = session.photo || 'https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=150&q=80';

  // Dark mode
  document.querySelector('.mode-switch').addEventListener('click', function () {
    document.documentElement.classList.toggle('dark');
    this.classList.toggle('active');
  });

  // Messages panel toggle
  document.getElementById('messages-toggle-btn').addEventListener('click', () => {
    document.getElementById('messages-panel').classList.add('show');
  });
  document.getElementById('messages-close-btn').addEventListener('click', () => {
    document.getElementById('messages-panel').classList.remove('show');
  });
  document.getElementById('notif-btn').addEventListener('click', () => {
    document.getElementById('messages-panel').classList.add('show');
  });

  // List/Grid toggle
  document.querySelector('.list-view').addEventListener('click', function () {
    document.querySelector('.grid-view').classList.remove('active');
    this.classList.add('active');
    document.getElementById('stage-cards-container').classList.remove('jsGridView');
    document.getElementById('stage-cards-container').classList.add('jsListView');
  });
  document.querySelector('.grid-view').addEventListener('click', function () {
    document.querySelector('.list-view').classList.remove('active');
    this.classList.add('active');
    document.getElementById('stage-cards-container').classList.remove('jsListView');
    document.getElementById('stage-cards-container').classList.add('jsGridView');
  });

  function renderStages(tasks) {
    const container = document.getElementById('stage-cards-container');
    const stages = DB.STAGES;
    container.innerHTML = stages.map((stage, i) => {
      const done = tasks[stage.key] === true;
      return `
        <div class="project-box-wrapper">
          <div class="project-box stage-card" style="background-color:${stage.bg};">
            <div class="project-box-header">
              <span>Stage ${i + 1} of ${stages.length}</span>
            </div>
            <div class="project-box-content-header">
              <p class="box-content-header">${stage.label}</p>
              <p class="box-content-subheader">
                <span class="status-pill ${done ? 'status-done' : 'status-pending'}">${done ? '✓ Completed' : 'Pending'}</span>
              </p>
            </div>
            <div class="box-progress-wrapper">
              <p class="box-progress-header">Progress</p>
              <div class="box-progress-bar">
                <span class="box-progress progress-bar-fill" style="width:${done ? 100 : 0}%;background-color:${stage.color};"></span>
              </div>
              <p class="box-progress-percentage">${done ? 100 : 0}%</p>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function renderNotifications(messages) {
    const feed = document.getElementById('notifications-feed');
    if (!messages.length) {
      feed.innerHTML = '<p style="padding:20px;text-align:center;color:var(--secondary-color);font-size:13px;">No notifications yet. Updates from your Agent will appear here.</p>';
      return;
    }
    feed.innerHTML = messages.map(msg => `
      <div class="notify-item">
        <img src="https://images.unsplash.com/photo-1543965170-4c01a586684e?w=150&q=80" alt="agent">
        <div class="notify-body">
          <div class="notify-sender">${msg.fromName}</div>
          <p class="notify-text">${msg.text}</p>
          <p class="notify-time">${new Date(msg.timestamp).toLocaleString()}</p>
        </div>
      </div>`).join('');
  }

  function renderMetrics(tasks) {
    const done = Object.values(tasks).filter(v => v === true).length;
    const remaining = 5 - done;
    document.getElementById('stages-done').textContent = done;
    document.getElementById('stages-remaining').textContent = remaining;
    const pct = Math.round((done / 5) * 100);
    document.getElementById('member-overall-status').textContent = `${pct}% Complete`;
  }

  // Subscribe to real-time updates
  DB.subscribe(function () {
    const tasks = DB.getTasks(session.id);
    renderStages(tasks);
    renderMetrics(tasks);
    renderNotifications(DB.getMessagesForMember(session.id));
  });
</script>
</body>
</html>
