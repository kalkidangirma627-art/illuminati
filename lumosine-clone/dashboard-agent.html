<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Dashboard | Illuminati.ethiopia</title>
  <link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">
  <link rel="stylesheet" href="public/assets/dashboard-style.css">
  <style>
    .member-card { cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    .member-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
    .back-btn { background:transparent; border:1px solid var(--main-color); color:var(--main-color); padding:6px 16px; border-radius:20px; cursor:pointer; font-size:13px; margin-bottom:16px; }
    .back-btn:hover { background:var(--main-color); color:white; }
    .checkbox-stage { display:flex; align-items:center; justify-content:space-between; }
    .stage-checkbox { width:22px; height:22px; cursor:pointer; accent-color:#34c471; }
    .msg-form { display:flex; flex-direction:column; gap:10px; padding:16px; }
    .msg-select, .msg-textarea { background:var(--projects-section); border:1px solid var(--message-box-border); color:var(--main-color); border-radius:6px; padding:8px 12px; width:100%; font-size:13px; }
    .msg-textarea { resize:vertical; min-height:80px; }
    .msg-send-btn { background:#34c471; color:white; border:none; border-radius:6px; padding:10px; cursor:pointer; font-weight:600; transition:background 0.2s; }
    .msg-send-btn:hover { background:#28a85c; }
    .member-initial { width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:white;flex-shrink:0; }
    .progress-pill { font-size:12px; padding:2px 10px; border-radius:20px; }
    .messages-section { overflow-y:auto; }
    @media (max-width:900px) {
      .messages-section { position:fixed !important; top:0; right:0; height:100vh; width:320px; z-index:100; }
    }
  </style>
</head>
<body>
<div class="app-container">

  <!-- HEADER -->
  <div class="app-header">
    <div class="app-header-left">
      <span class="app-icon"></span>
      <p class="app-name">Agent Panel</p>
      <div class="search-wrapper">
        <input class="search-input" type="text" placeholder="Search members..." id="search-input">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      </div>
    </div>
    <div class="app-header-right">
      <button class="mode-switch" title="Switch Theme">
        <svg class="moon" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" width="24" height="24" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
      <button class="messages-btn" id="msg-panel-btn" title="Send Message">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
      </button>
      <button class="profile-btn">
        <img id="header-avatar" src="" alt="avatar">
        <span id="header-name">Agent</span>
      </button>
      <button onclick="DB.logout()" title="Logout" style="background:transparent;border:none;cursor:pointer;padding:8px;color:var(--main-color);">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="app-content">
    <div class="app-sidebar">
      <a href="#" class="app-sidebar-link active">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
      <a href="#" class="app-sidebar-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><path d="M21.21 15.89A10 10 0 118 2.83M22 12A10 10 0 0012 2v10z"/></svg>
      </a>
    </div>

    <div class="projects-section">
      <div class="projects-section-header">
        <p id="section-title">My Members</p>
        <p class="time" id="section-date"></p>
      </div>

      <!-- METRICS -->
      <div class="projects-section-line">
        <div class="projects-status">
          <div class="item-status">
            <span class="status-number" id="count-inprogress">0</span>
            <span class="status-type">In Progress</span>
          </div>
          <div class="item-status">
            <span class="status-number" id="count-upcoming">0</span>
            <span class="status-type">Upcoming</span>
          </div>
          <div class="item-status">
            <span class="status-number" id="count-completed">0</span>
            <span class="status-type">Completed</span>
          </div>
        </div>
        <div class="view-actions">
          <button class="view-btn list-view" title="List View">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
          <button class="view-btn grid-view active" title="Grid View">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          </button>
        </div>
      </div>

      <!-- MAIN VIEW (member list OR detail) -->
      <div class="project-boxes jsGridView" id="main-view-container"></div>
    </div>
  </div>

  <!-- MESSAGE PANEL -->
  <div class="messages-section" id="messages-panel">
    <button class="messages-close" id="msg-close-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
    </button>
    <div class="projects-section-header"><p>Send Status Update</p></div>
    <div class="msg-form">
      <label style="color:var(--secondary-color);font-size:13px;">Select Member</label>
      <select class="msg-select" id="msg-member-select"></select>
      <label style="color:var(--secondary-color);font-size:13px;">Message</label>
      <textarea class="msg-textarea" id="msg-text" placeholder="Type your status update..."></textarea>
      <button class="msg-send-btn" id="msg-send-btn">Send Update</button>
      <p id="msg-feedback" style="font-size:12px;color:#34c471;text-align:center;display:none;">✓ Message sent!</p>
    </div>
  </div>

</div>

<script src="public/assets/db.js"></script>
<script>
  const session = DB.requireAuth('Agent');
  if (!session) throw new Error('Not authenticated');

  document.getElementById('header-name').textContent = session.name;
  document.getElementById('header-avatar').src = session.photo || '';
  document.getElementById('section-date').textContent = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric' });

  let selectedMemberId = null;

  document.querySelector('.mode-switch').addEventListener('click', function () {
    document.documentElement.classList.toggle('dark');
    this.classList.toggle('active');
  });

  document.getElementById('msg-panel-btn').addEventListener('click', () => document.getElementById('messages-panel').classList.add('show'));
  document.getElementById('msg-close-btn').addEventListener('click', () => document.getElementById('messages-panel').classList.remove('show'));

  document.querySelector('.list-view').addEventListener('click', function () {
    document.querySelector('.grid-view').classList.remove('active');
    this.classList.add('active');
    document.getElementById('main-view-container').classList.replace('jsGridView', 'jsListView');
  });
  document.querySelector('.grid-view').addEventListener('click', function () {
    document.querySelector('.list-view').classList.remove('active');
    this.classList.add('active');
    document.getElementById('main-view-container').classList.replace('jsListView', 'jsGridView');
  });

  const COLORS = ['#4f3ff0','#ff942e','#096c86','#df3670','#34c471'];

  function updateMetrics(members) {
    let inProgress = 0, upcoming = 0, completed = 0;
    members.forEach(m => {
      const t = DB.getTasks(m.id);
      const done = Object.values(t).filter(v => v).length;
      if (done === 0) upcoming++;
      else if (done === 5) completed++;
      else inProgress++;
    });
    document.getElementById('count-inprogress').textContent = inProgress;
    document.getElementById('count-upcoming').textContent = upcoming;
    document.getElementById('count-completed').textContent = completed;
  }

  function renderMemberList(members) {
    selectedMemberId = null;
    document.getElementById('section-title').textContent = 'My Members';
    updateMetrics(members);

    const container = document.getElementById('main-view-container');
    if (!members.length) {
      container.innerHTML = '<p style="padding:20px;color:var(--secondary-color);">No members assigned to you yet.</p>';
      return;
    }

    // Populate msg dropdown
    const sel = document.getElementById('msg-member-select');
    sel.innerHTML = members.map(m => `<option value="${m.id}">${m.name}</option>`).join('');

    container.innerHTML = members.map((m, i) => {
      const prog = DB.getMemberProgress(m.id);
      const color = COLORS[i % COLORS.length];
      return `
        <div class="project-box-wrapper">
          <div class="project-box member-card" onclick="openMemberDetail('${m.id}')" style="background-color:transparent;border:1px solid var(--message-box-border);">
            <div class="project-box-header">
              <span>Member</span>
              <div style="display:flex;align-items:center;gap:8px;">
                <img src="${m.photo}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;">
              </div>
            </div>
            <div class="project-box-content-header">
              <p class="box-content-header">${m.name}</p>
              <p class="box-content-subheader">${m.email}</p>
            </div>
            <div class="box-progress-wrapper">
              <p class="box-progress-header">Overall Progress</p>
              <div class="box-progress-bar">
                <span class="box-progress" style="width:${prog.percent}%;background-color:${color};"></span>
              </div>
              <p class="box-progress-percentage">${prog.percent}%</p>
            </div>
            <div class="project-box-footer">
              <div style="font-size:12px;color:${color};font-weight:600;">${prog.completed}/5 stages done</div>
              <div style="font-size:12px;color:var(--secondary-color);">Click to manage →</div>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function openMemberDetail(memberId) {
    selectedMemberId = memberId;
    const member = DB.getUser(memberId);
    const tasks = DB.getTasks(memberId);
    document.getElementById('section-title').textContent = `Managing: ${member.name}`;

    const container = document.getElementById('main-view-container');
    container.innerHTML = `
      <div style="width:100%;padding:8px 0 20px;">
        <button class="back-btn" onclick="goBack()">← Back to Members</button>
        <div style="display:flex;align-items:center;gap:12px;margin-top:8px;">
          <img src="${member.photo}" style="width:48px;height:48px;border-radius:50%;object-fit:cover;">
          <div>
            <p style="color:var(--main-color);font-weight:700;font-size:16px;">${member.name}</p>
            <p style="color:var(--secondary-color);font-size:13px;">${member.email}</p>
          </div>
        </div>
      </div>
      ${DB.STAGES.map((stage, i) => {
        const done = tasks[stage.key] === true;
        return `
          <div class="project-box-wrapper">
            <div class="project-box stage-card" style="background-color:${stage.bg};">
              <div class="project-box-header">
                <span>Stage ${i + 1}</span>
              </div>
              <div class="project-box-content-header">
                <p class="box-content-header" style="font-size:15px;">${stage.label}</p>
              </div>
              <div class="box-progress-wrapper checkbox-stage">
                <p class="box-progress-header" style="margin:0;">${done ? '✓ Completed' : 'Mark as Done'}</p>
                <input type="checkbox" class="stage-checkbox"
                  ${done ? 'checked' : ''}
                  onchange="toggleStage('${memberId}','${stage.key}', this.checked)">
              </div>
            </div>
          </div>`;
      }).join('')}`;
  }

  function toggleStage(memberId, taskKey, value) {
    DB.setTask(memberId, taskKey, value, session.name);
  }

  function goBack() {
    const members = DB.getMembersByAgent(session.id);
    renderMemberList(members);
  }

  // Send message
  document.getElementById('msg-send-btn').addEventListener('click', () => {
    const memberId = document.getElementById('msg-member-select').value;
    const text = document.getElementById('msg-text').value.trim();
    if (!memberId || !text) return;
    DB.sendMessage(memberId, session.name, text);
    document.getElementById('msg-text').value = '';
    const fb = document.getElementById('msg-feedback');
    fb.style.display = 'block';
    setTimeout(() => fb.style.display = 'none', 3000);
  });

  // Real-time subscription
  DB.subscribe(function () {
    const members = DB.getMembersByAgent(session.id);
    if (selectedMemberId) {
      openMemberDetail(selectedMemberId);
      updateMetrics(members);
    } else {
      renderMemberList(members);
    }
  });
</script>
</body>
</html>
