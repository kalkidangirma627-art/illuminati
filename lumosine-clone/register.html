<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Order - Register | Illuminati.ethiopia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @font-face {
      font-family: Delight;
      src: url("https://cdn.prod.website-files.com/68c276a7cb47ae57b08b33d1/68c2772925b371feed8be318_Delight-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
    }
    .delight { font-family: Delight, Arial, sans-serif; }
  </style>
</head>
<body class="min-h-screen w-full bg-cover bg-center flex justify-center items-center py-8"
  style="background-image: url('https://i.postimg.cc/vTXTYy2P/login-bg.jpg');">
  <div class="w-full max-w-md px-4">
    <div class="bg-black/80 backdrop-blur-3xl p-8 w-full border-t-4 border-green-600 rounded-lg shadow-2xl">
      <div class="mb-6 text-center">
        <a href="index.html"><h1 class="delight text-4xl text-green-500">THE ORDER</h1></a>
        <h4 class="text-white text-xl font-semibold mt-4 mb-1">Request Access</h4>
        <p class="text-gray-400 text-sm">Submit your dossier for evaluation.</p>
      </div>

      <div id="error-msg" class="hidden text-red-400 text-sm bg-red-400/10 border border-red-400/30 rounded px-3 py-2 mb-4"></div>
      <div id="success-msg" class="hidden text-green-400 text-sm bg-green-400/10 border border-green-400/30 rounded px-3 py-2 mb-4"></div>

      <form id="register-form" class="flex flex-col gap-4">
        <div>
          <label for="fullname" class="block text-sm font-semibold text-gray-200 mb-1">Full Legal Name</label>
          <input class="block w-full rounded py-2 px-3 bg-transparent border border-white/10 text-white/80 focus:border-green-500 focus:outline-none"
            type="text" id="fullname" required placeholder="Enter your full name">
        </div>
        <div>
          <label for="email" class="block text-sm font-semibold text-gray-200 mb-1">Email Address</label>
          <input class="block w-full rounded py-2 px-3 bg-transparent border border-white/10 text-white/80 focus:border-green-500 focus:outline-none"
            type="email" id="email" required placeholder="Enter your email">
        </div>
        <div>
          <label for="phone" class="block text-sm font-semibold text-gray-200 mb-1">Phone Number (unique)</label>
          <input class="block w-full rounded py-2 px-3 bg-transparent border border-white/10 text-white/80 focus:border-green-500 focus:outline-none"
            type="tel" id="phone" required placeholder="+251...">
        </div>
        <div>
          <label for="reg-password" class="block text-sm font-semibold text-gray-200 mb-1">Create Passphrase</label>
          <input class="block w-full rounded py-2 px-3 bg-transparent border border-white/10 text-white/80 focus:border-green-500 focus:outline-none"
            type="password" id="reg-password" required placeholder="Create a secure passphrase">
        </div>
        <button class="w-full py-2.5 bg-white/10 text-white border border-white/20 rounded-lg hover:bg-green-600/70 transition-all duration-300 font-semibold mt-2"
          type="submit">Submit Dossier</button>
      </form>

      <footer class="text-center mt-4">
        <p class="text-sm text-gray-400">Already cleared? <a href="login.html" class="text-green-500 ml-1 hover:underline font-bold">Log In</a></p>
      </footer>
    </div>
  </div>
  <script src="public/assets/db.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('reg-password').value;
      const err = document.getElementById('error-msg');
      const suc = document.getElementById('success-msg');
      err.classList.add('hidden');
      suc.classList.add('hidden');

      const result = DB.registerMember(name, email, phone, password);
      if (!result.ok) {
        err.textContent = result.error;
        err.classList.remove('hidden');
        return;
      }
      suc.textContent = 'Request submitted! Your account is pending Admin approval. You will be notified.';
      suc.classList.remove('hidden');
      this.reset();
    });
  </script>
</body>
</html>
