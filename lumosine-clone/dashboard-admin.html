<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Illuminati.ethiopia</title>
  <link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">
  <link rel="stylesheet" href="public/assets/dashboard-style.css">
  <style>
    .tab-bar { display:flex; gap:4px; padding:16px 24px 0; border-bottom:1px solid var(--message-box-border); background:var(--projects-section); flex-wrap:wrap; }
    .tab-btn { padding:8px 18px; border:none; border-radius:6px 6px 0 0; cursor:pointer; font-size:13px; font-weight:600; background:transparent; color:var(--secondary-color); transition:all 0.2s; border-bottom:2px solid transparent; }
    .tab-btn.active { color:var(--main-color); border-bottom:2px solid #4f3ff0; background:var(--tasks-section); }
    .tab-content { display:none; }
    .tab-content.active { display:block; }
    .member-row { display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--message-box-border); cursor:pointer; transition:background 0.15s; }
    .member-row:hover { background:rgba(255,255,255,0.04); }
    .member-row img { width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0; }
    .member-row .member-info { flex:1; }
    .member-row .member-name { font-weight:600;color:var(--main-color);font-size:14px; }
    .member-row .member-sub { font-size:12px;color:var(--secondary-color); }
    .status-badge { padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700; }
    .badge-pending { background:rgba(255,148,46,0.15);color:#ff942e; }
    .badge-approved { background:rgba(52,196,113,0.15);color:#34c471; }
    .badge-suspended { background:rgba(255,94,94,0.15);color:#ff5e5e; }
    .action-btn { padding:5px 12px;border:none;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600;transition:all 0.2s; }
    .btn-approve { background:#34c471;color:white; }
    .btn-suspend { background:#ff5e5e;color:white; }
    .btn-activate { background:#4f3ff0;color:white; }
    .assign-select { background:var(--tasks-section);border:1px solid var(--message-box-border);color:var(--main-color);border-radius:4px;padding:4px 8px;font-size:12px; }
    .back-btn { background:transparent;border:1px solid var(--main-color);color:var(--main-color);padding:6px 16px;border-radius:20px;cursor:pointer;font-size:13px;margin-bottom:16px; }
    .back-btn:hover { background:var(--main-color);color:white; }
    .checkbox-stage { display:flex;align-items:center;justify-content:space-between; }
    .stage-checkbox { width:22px;height:22px;cursor:pointer;accent-color:#34c471; }
    .section-wrap { padding:0; }
    .msg-form { display:flex;flex-direction:column;gap:10px;padding:16px; }
    .msg-select, .msg-textarea { background:var(--projects-section);border:1px solid var(--message-box-border);color:var(--main-color);border-radius:6px;padding:8px 12px;width:100%;font-size:13px; }
    .msg-textarea { resize:vertical;min-height:80px; }
    .msg-send-btn { background:#34c471;color:white;border:none;border-radius:6px;padding:10px;cursor:pointer;font-weight:600; }
    .agent-card { padding:16px 20px;border-bottom:1px solid var(--message-box-border); }
    .agent-card .agent-header { display:flex;align-items:center;gap:12px;margin-bottom:10px; }
    .agent-card img { width:42px;height:42px;border-radius:50%;object-fit:cover; }
    .agent-stat { display:flex;gap:16px;flex-wrap:wrap; }
    .agent-stat-item { text-align:center; }
    .agent-stat-num { font-size:20px;font-weight:700;color:var(--main-color); }
    .agent-stat-label { font-size:11px;color:var(--secondary-color); }
    .messages-section { overflow-y:auto; }
    @media (max-width:900px) {
      .messages-section { position:fixed !important;top:0;right:0;height:100vh;width:320px;z-index:100; }
    }
  </style>
</head>
<body>
<div class="app-container">

  <!-- HEADER -->
  <div class="app-header">
    <div class="app-header-left">
      <span class="app-icon"></span>
      <p class="app-name">Admin Control</p>
      <div class="search-wrapper">
        <input class="search-input" type="text" placeholder="Search..." id="admin-search">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      </div>
    </div>
    <div class="app-header-right">
      <button class="mode-switch" title="Switch Theme">
        <svg class="moon" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" width="24" height="24" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
      <button class="messages-btn" id="msg-panel-btn" title="Send Message to Member">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
      </button>
      <button class="profile-btn">
        <img id="header-avatar" src="" alt="avatar">
        <span id="header-name">Admin</span>
      </button>
      <button onclick="DB.logout()" title="Logout" style="background:transparent;border:none;cursor:pointer;padding:8px;color:var(--main-color);">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </div>

  <div class="app-content">
    <div class="app-sidebar">
      <a href="#" class="app-sidebar-link active">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
      <a href="#" class="app-sidebar-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><path d="M21.21 15.89A10 10 0 118 2.83M22 12A10 10 0 0012 2v10z"/></svg>
      </a>
      <a href="#" class="app-sidebar-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </a>
    </div>

    <div class="projects-section" style="padding:0;">
      <!-- GLOBAL METRICS -->
      <div style="padding:16px 24px;">
        <div class="projects-section-header" style="padding:0 0 12px;">
          <p>System Overview</p>
          <p class="time" id="admin-date"></p>
        </div>
        <div class="projects-section-line" style="border-bottom:none;padding:0;">
          <div class="projects-status">
            <div class="item-status"><span class="status-number" id="m-pending">0</span><span class="status-type">Pending</span></div>
            <div class="item-status"><span class="status-number" id="m-active">0</span><span class="status-type">Active Members</span></div>
            <div class="item-status"><span class="status-number" id="m-complete">0</span><span class="status-type">Fully Done</span></div>
          </div>
        </div>
      </div>

      <!-- TABS -->
      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('members')">Members</button>
        <button class="tab-btn" onclick="switchTab('agents')">Agents</button>
        <button class="tab-btn" onclick="switchTab('manage')">Manage Progress</button>
      </div>

      <!-- TAB: MEMBERS -->
      <div class="tab-content active section-wrap" id="tab-members">
        <div id="members-list"></div>
      </div>

      <!-- TAB: AGENTS -->
      <div class="tab-content section-wrap" id="tab-agents">
        <div id="agents-list"></div>
      </div>

      <!-- TAB: MANAGE PROGRESS -->
      <div class="tab-content section-wrap" id="tab-manage">
        <div id="manage-view">
          <p style="padding:20px;color:var(--secondary-color);font-size:13px;">Select a member from the Members tab to manage their progress.</p>
        </div>
      </div>

    </div>
  </div>

  <!-- MESSAGE PANEL -->
  <div class="messages-section" id="messages-panel">
    <button class="messages-close" id="msg-close-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
    </button>
    <div class="projects-section-header"><p>Send Status Update</p></div>
    <div class="msg-form">
      <label style="color:var(--secondary-color);font-size:13px;">Select Member</label>
      <select class="msg-select" id="msg-member-select"></select>
      <label style="color:var(--secondary-color);font-size:13px;">Message</label>
      <textarea class="msg-textarea" id="msg-text" placeholder="Type your message..."></textarea>
      <button class="msg-send-btn" id="msg-send-btn">Send</button>
      <p id="msg-feedback" style="font-size:12px;color:#34c471;text-align:center;display:none;">✓ Sent!</p>
    </div>
  </div>

</div>

<script src="public/assets/db.js"></script>
<script>
  const session = DB.requireAuth('Admin');
  if (!session) throw new Error('Not authenticated');

  document.getElementById('header-name').textContent = session.name;
  document.getElementById('header-avatar').src = session.photo || '';
  document.getElementById('admin-date').textContent = new Date().toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });

  document.querySelector('.mode-switch').addEventListener('click', function () {
    document.documentElement.classList.toggle('dark'); this.classList.toggle('active');
  });

  document.getElementById('msg-panel-btn').addEventListener('click', () => document.getElementById('messages-panel').classList.add('show'));
  document.getElementById('msg-close-btn').addEventListener('click', () => document.getElementById('messages-panel').classList.remove('show'));

  let activeTab = 'members';
  let managingMemberId = null;

  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      const tabs = ['members','agents','manage'];
      b.classList.toggle('active', tabs[i] === tab);
    });
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
  }

  function openMemberManage(memberId) {
    managingMemberId = memberId;
    switchTab('manage');
    renderManageView();
  }

  function renderManageView() {
    const member = DB.getUser(managingMemberId);
    if (!member) return;
    const tasks = DB.getTasks(managingMemberId);
    const view = document.getElementById('manage-view');
    view.innerHTML = `
      <div style="padding:16px 20px;">
        <button class="back-btn" onclick="managingMemberId=null;document.getElementById('manage-view').innerHTML='<p style=padding:20px;color:var(--secondary-color)>Select a member from the Members tab.</p>';switchTab('members');">← Back</button>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
          <img src="${member.photo}" style="width:48px;height:48px;border-radius:50%;object-fit:cover;">
          <div><p style="color:var(--main-color);font-weight:700;font-size:16px;">${member.name}</p>
          <p style="color:var(--secondary-color);font-size:13px;">${member.email}</p></div>
        </div>
        <div class="project-boxes jsGridView">
          ${DB.STAGES.map((stage, i) => {
            const done = tasks[stage.key] === true;
            return `
            <div class="project-box-wrapper">
              <div class="project-box" style="background-color:${stage.bg};">
                <div class="project-box-header"><span>Stage ${i+1}</span></div>
                <div class="project-box-content-header">
                  <p class="box-content-header" style="font-size:15px;">${stage.label}</p>
                </div>
                <div class="box-progress-wrapper checkbox-stage">
                  <p class="box-progress-header" style="margin:0;">${done ? '✓ Done' : 'Mark Done'}</p>
                  <input type="checkbox" class="stage-checkbox" ${done ? 'checked' : ''}
                    onchange="DB.setTask('${managingMemberId}','${stage.key}',this.checked,'${session.name}')">
                </div>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
  }

  function renderMembersList() {
    const members = DB.getAllMembers();
    const agents = DB.getAllAgents();

    // Update msg dropdown
    const sel = document.getElementById('msg-member-select');
    sel.innerHTML = members.filter(m => m.status === 'Approved').map(m => `<option value="${m.id}">${m.name}</option>`).join('');

    // Global metrics
    const pending = members.filter(m => m.status === 'Pending').length;
    const active = members.filter(m => m.status === 'Approved').length;
    const complete = members.filter(m => {
      const t = DB.getTasks(m.id);
      return Object.values(t).filter(v=>v).length === 5;
    }).length;
    document.getElementById('m-pending').textContent = pending;
    document.getElementById('m-active').textContent = active;
    document.getElementById('m-complete').textContent = complete;

    const list = document.getElementById('members-list');
    if (!members.length) { list.innerHTML = '<p style="padding:20px;color:var(--secondary-color);">No members found.</p>'; return; }

    list.innerHTML = members.map(m => {
      const prog = DB.getMemberProgress(m.id);
      const assignedAgent = agents.find(a => a.id === m.agentId);
      const badgeClass = m.status === 'Pending' ? 'badge-pending' : m.status === 'Approved' ? 'badge-approved' : 'badge-suspended';
      const agentOptions = agents.map(a => `<option value="${a.id}" ${m.agentId===a.id?'selected':''}>${a.name}</option>`).join('');
      return `
        <div class="member-row" style="flex-wrap:wrap;gap:8px;">
          <img src="${m.photo}" alt="${m.name}">
          <div class="member-info" style="flex:1;min-width:120px;">
            <div class="member-name">${m.name}</div>
            <div class="member-sub">${m.email} · ${m.phone}</div>
            <div style="margin-top:4px;font-size:12px;color:var(--secondary-color);">Progress: ${prog.percent}% (${prog.completed}/5)</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span class="status-badge ${badgeClass}">${m.status}</span>
            ${m.status === 'Pending' ? `<button class="action-btn btn-approve" onclick="DB.updateUserStatus('${m.id}','Approved');renderAll();">Approve</button>` : ''}
            ${m.status === 'Approved' ? `<button class="action-btn btn-suspend" onclick="DB.updateUserStatus('${m.id}','Suspended');renderAll();">Suspend</button>` : ''}
            ${m.status === 'Suspended' ? `<button class="action-btn btn-activate" onclick="DB.updateUserStatus('${m.id}','Approved');renderAll();">Reinstate</button>` : ''}
            <select class="assign-select" onchange="DB.assignAgentToMember('${m.id}',this.value);renderAll();">
              <option value="">Assign Agent</option>
              ${agentOptions}
            </select>
            <button class="action-btn" style="background:#4f3ff0;color:white;" onclick="openMemberManage('${m.id}')">Manage Progress</button>
          </div>
        </div>`;
    }).join('');
  }

  function renderAgentsList() {
    const agents = DB.getAllAgents();
    const allMembers = DB.getAllMembers();
    const list = document.getElementById('agents-list');
    if (!agents.length) { list.innerHTML = '<p style="padding:20px;color:var(--secondary-color);">No agents found.</p>'; return; }

    list.innerHTML = agents.map(agent => {
      const myMembers = allMembers.filter(m => m.agentId === agent.id);
      let inProg = 0, upcoming = 0, done = 0;
      myMembers.forEach(m => {
        const t = DB.getTasks(m.id);
        const c = Object.values(t).filter(v=>v).length;
        if (c === 0) upcoming++;
        else if (c === 5) done++;
        else inProg++;
      });
      return `
        <div class="agent-card">
          <div class="agent-header">
            <img src="${agent.photo}" alt="${agent.name}">
            <div>
              <div style="font-weight:700;color:var(--main-color);">${agent.name}</div>
              <div style="font-size:12px;color:var(--secondary-color);">${agent.email}</div>
            </div>
            <span class="status-badge badge-approved" style="margin-left:auto;">Active</span>
          </div>
          <div class="agent-stat">
            <div class="agent-stat-item"><div class="agent-stat-num">${myMembers.length}</div><div class="agent-stat-label">Assigned</div></div>
            <div class="agent-stat-item"><div class="agent-stat-num">${inProg}</div><div class="agent-stat-label">In Progress</div></div>
            <div class="agent-stat-item"><div class="agent-stat-num">${upcoming}</div><div class="agent-stat-label">Upcoming</div></div>
            <div class="agent-stat-item"><div class="agent-stat-num">${done}</div><div class="agent-stat-label">Completed</div></div>
          </div>
        </div>`;
    }).join('');
  }

  function renderAll() {
    renderMembersList();
    renderAgentsList();
    if (managingMemberId) renderManageView();
  }

  document.getElementById('msg-send-btn').addEventListener('click', () => {
    const memberId = document.getElementById('msg-member-select').value;
    const text = document.getElementById('msg-text').value.trim();
    if (!memberId || !text) return;
    DB.sendMessage(memberId, session.name, text);
    document.getElementById('msg-text').value = '';
    const fb = document.getElementById('msg-feedback');
    fb.style.display = 'block';
    setTimeout(() => fb.style.display = 'none', 3000);
  });

  DB.subscribe(renderAll);
</script>
</body>
</html>
