<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Illuminati.ethiopia - Request Access</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', Arial, sans-serif;
    }

    .login-title {
      font-family: 'Inter', Arial, sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      line-height: 1.1;
    }

    .login-title .sub {
      font-size: 0.35em;
      font-weight: 400;
      letter-spacing: 0.2em;
      opacity: 0.7;
      display: block;
      margin-top: 2px;
    }

    #register-error {
      color: #ef4444;
      font-size: 0.85rem;
      min-height: 1.2em;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    #register-success {
      color: #22c55e;
      font-size: 0.85rem;
      min-height: 1.2em;
      text-align: center;
      margin-bottom: 0.5rem;
    }
  </style>
</head>

<body class="min-h-screen w-full bg-cover bg-center relative bg-no-repeat flex justify-center items-center py-10"
  style="background-image: url('https://i.postimg.cc/vTXTYy2P/login-bg.jpg'); overflow-y: auto;">
  <div class="inline-flex items-center justify-center p-4 bg-transparent w-full sm:w-auto">
    <div class="w-full sm:min-w-[500px]">
      <div
        class="bg-black/40 backdrop-blur-3xl lg:max-w-[540px] z-10 p-8 relative w-full h-full border-t-4 border-green-600 rounded-lg">
        <div class="flex flex-col h-full gap-4">
          <div class="mb-6 text-center lg:text-start">
            <a href="index.html" class="flex justify-center lg:justify-start items-center gap-3">
              <img src="/assets/ethiopiaemblem.svg" alt="Emblem" class="w-10 h-10">
              <h1 class="login-title text-3xl text-green-500">
                THE ORDER
                <span class="sub">.ethiopia</span>
              </h1>
            </a>
          </div>
          <div class="my-auto">
            <h4 class="text-white text-2xl font-semibold mb-2">Request Access</h4>
            <p class="text-gray-400 mb-6">Submit your dossier for evaluation. Invite only.</p>

            <div id="register-error"></div>
            <div id="register-success"></div>

            <form id="register-form">
              <div class="mb-4">
                <label for="fullname" class="block text-sm font-semibold text-gray-200 mb-2">Full Legal Name</label>
                <input
                  class="block w-full rounded py-1.5 px-3 bg-transparent border border-white/10 text-white/80 focus:border-green-500 focus:outline-0 focus:ring-0"
                  type="text" id="fullname" required placeholder="Enter your full name" />
              </div>

              <div class="mb-4">
                <label for="email" class="block text-sm font-semibold text-gray-200 mb-2">Encrypted Email
                  Address</label>
                <input
                  class="block w-full rounded py-1.5 px-3 bg-transparent border border-white/10 text-white/80 focus:border-green-500 focus:outline-0 focus:ring-0"
                  type="email" id="email" required placeholder="Enter your email" />
              </div>

              <div class="mb-4">
                <label for="password" class="block text-sm font-semibold text-gray-200 mb-2">Passphrase</label>
                <input
                  class="block w-full rounded py-1.5 px-3 bg-transparent border border-white/10 text-white/80 focus:border-green-500 focus:outline-0 focus:ring-0"
                  type="password" id="password" required placeholder="Create your passphrase" />
              </div>

              <div class="mb-4">
                <label for="role" class="block text-sm font-semibold text-gray-200 mb-2">Requested Clearance
                  Level</label>
                <select
                  class="block w-full rounded py-1.5 px-3 bg-black/60 border border-white/10 text-white/80 focus:border-green-500 focus:outline-0 focus:ring-0"
                  id="role" required>
                  <option value="member">Member</option>
                  <option value="agent">Agent</option>
                </select>
              </div>

              <div class="mb-6 text-center">
                <button
                  class="w-full inline-flex items-center justify-center px-6 py-2 backdrop-blur-2xl bg-white/10 text-white border border-white/20 rounded-lg transition-all duration-500 group hover:bg-green-600/60 hover:text-white mt-2"
                  type="submit" id="register-btn">Submit Dossier</button>
              </div>
            </form>
          </div>

          <footer class="text-center mt-2">
            <p class="text-base inline-block px-2 py-1 text-gray-400">Already a member? <a href="login.html"
                class="text-green-500 ms-1 hover:underline"><b>Log In</b></a></p>
          </footer>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3001';

    // Clear any existing session to prevent auto-redirects on login page
    localStorage.clear();

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('register-error');
      const successEl = document.getElementById('register-success');
      const btn = document.getElementById('register-btn');
      errorEl.textContent = '';
      successEl.textContent = '';
      btn.textContent = 'Processing...';
      btn.disabled = true;

      const name = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;

      try {
        const res = await fetch(`${API_BASE}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role })
        });

        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.error || 'Registration failed.';
          btn.textContent = 'Submit Dossier';
          btn.disabled = false;
          return;
        }

        successEl.textContent = 'Dossier submitted. Awaiting admin approval...';
        btn.textContent = 'Submitted';
        setTimeout(() => { window.location.href = 'login.html'; }, 2500);
      } catch (err) {
        errorEl.textContent = 'Server unreachable. Please try again.';
        btn.textContent = 'Submit Dossier';
        btn.disabled = false;
      }
    });
  </script>
</body>

</html>
